name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20 # Đã cập nhật từ 'lts/*' thành '20'
    - name: Install dependencies
      run: npm ci # Đã thay thế 'npm install -g yarn && yarn' bằng 'npm ci' để cài đặt nhanh và nhất quán hơn
    - name: Install Playwright browsers
      run: npx playwright install --with-deps # Đã thay thế 'yarn playwright install --with-deps' bằng 'npx playwright install --with-deps'
    - name: Run Playwright tests
      run: npm test # Đã thay thế 'yarn playwright test' bằng 'npm test'
    - name: Generate Allure Report
      if: always() # Luôn tạo báo cáo ngay cả khi test thất bại
      run: npm run allure:generate # Thêm bước tạo Allure report
    - name: Upload Allure Report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 5 # Lưu báo cáo trong 5 ngày
    - name: Upload Playwright Test Results
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report # Path mặc định của Playwright HTML report
        retention-days: 5
    - name: Upload Playwright Trace (optional)
      if: always() # Luôn tải lên trace nếu có, hữu ích cho debug
      uses: actions/upload-artifact@v4
      with:
        name: playwright-trace
        path: test-results/ # Playwright lưu trace trong thư mục này
        retention-days: 5